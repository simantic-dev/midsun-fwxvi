# Three boards on one CAN bus. Paths are relative to this file.
machines:
  bms:
    mcu: STM32L496RG
    overlay: bms.board
    elf: ../../build/arm/bin/projects/rear_controller.elf
  front:
    mcu: STM32L433CC
    overlay: front.board
    elf: ../../build/arm/bin/projects/front_controller.elf
  telemetry:
    mcu: STM32L433CC
    overlay: telemetry.board
    elf: ../../build/arm/bin/projects/telemetry.elf
media:
  - type: can
    connect: [bms.can1, bms.steering, front.can1, front.ws22, telemetry.can1]
  - type: uart
    connect: [telemetry.usart2, telemetry.xbee]
timeout: 600

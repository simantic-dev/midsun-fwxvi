machines:
  bms:
    mcu: STM32L496RG
    overlay: bms.board
    elf: ../build/arm/bin/projects/rear_controller.elf
  front:
    mcu: STM32L433CC
    elf: ../build/arm/bin/projects/front_controller.elf
  telemetry:
    mcu: STM32L433CC
    elf: ../build/arm/bin/projects/telemetry.elf
media:
  - type: can
    connect: [bms.can1, bms.steering, front.can1, telemetry.can1]
timeout: 120
